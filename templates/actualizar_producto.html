<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Producto | AgronoMia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap');
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('{{ url_for("static", filename="images/background-prod.png") }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            min-height: 100vh;
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
        }
        nav {
            background: rgba(24, 26, 27, 0.70);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 32px;
        }
        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        nav a {
            color: #f5f5f7;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        nav a img {
            height: 28px;
            width: 28px;
            vertical-align: middle;
        }
        nav a:hover {
            background: rgba(255,255,255,0.08);
            color: #00e6b0;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px; 
            width: 100%;
            margin: 0 auto;
            background: rgba(24, 26, 27, 0.70); 
            backdrop-filter: blur(10px);
            border-radius: 26px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            padding: 48px 48px 38px 48px;
            margin-top: 110px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #00e6b0;
            margin-bottom: 28px;
            text-align: center;
            font-size: 2em;
            font-family: inherit;
            letter-spacing: 1px;
            font-weight: 800;
            text-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            max-width: 600px; 
            margin: 0 auto;
        }
        form label {
            color: #00e6b0;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 0;
            text-align: left;
            width: 100%;
            letter-spacing: 0.5px;
            font-size: 1em;
        }
        form input,
        form textarea,
        form select {
            width: 100%;
            max-width: 100%; 
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 2px solid #00e6b0;
            border-radius: 14px;
            font-size: 1.08em;
            background: rgba(30, 34, 36, 0.96);
            color: #f5f5f7;
            transition: border 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }
        form input:focus, form textarea:focus, form select:focus {
            border-color: #00e6b0;
            outline: none;
            box-shadow: 0px 4px 16px rgba(0,230,176,0.13);
        }
        form button {
            background: linear-gradient(90deg, #00e6b0 0%, #00b88a 100%);
            color: #181a1b;
            font-weight: 600;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 1.08em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            margin-top: 8px;
            box-shadow: 0 2px 10px rgba(0,230,176,0.10);
        }
        form button:hover {
            background: linear-gradient(90deg, #00b88a 0%, #00e6b0 100%);
            color: #fff;
            transform: scale(1.03);
        }
        .imagen-actual {
            margin-bottom: 18px;
            text-align: center;
            width: 100%;
        }
        .imagen-actual img {
            max-width: 120px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,230,176,0.08);
        }
        .volver {
            display: block;
            margin: 18px auto 0 auto;
            color: #00e6b0;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: color 0.2s;
            font-size: 1.1em;
        }
        .volver:hover {
            color: #fff;
            text-decoration: underline;
        }
        footer {
            background: rgba(24, 26, 27, 0.65);
            backdrop-filter: blur(10px);
            color: #aaa;
            text-align: center;
            padding: 18px 0 10px 0;
            font-size: 1em;
            letter-spacing: 1px;
            margin-top: auto;
            border-top: 1px solid #222;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
            position: static;
        }
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                height: auto;
                padding: 10px 5px;
            }
            .nav-left, .nav-right {
                flex-direction: column;
                gap: 10px;
            }
            .container {
                max-width: 98vw;
                padding: 12px 4vw 18px 4vw;
                margin-top: 120px;
                margin-bottom: 80px;
            }
            form {
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="{{ url_for('panel_productor') }}">
                <img src="{{ url_for('static', filename='images/inicio.png') }}" alt="Panel Productor">
                Panel Productor
            </a>
        </div>
        <div class="nav-right">
            <a href="{{ url_for('logout') }}" id="logout-link">
                <img src="{{ url_for('static', filename='images/cerrar.png') }}" alt="Cerrar Sesión">
                Cerrar Sesión
            </a>
        </div>
    </nav>
    <div class="main-content">
        <div class="container">
            <h2>Actualizar Producto</h2>
            <form action="" method="POST" enctype="multipart/form-data">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
                
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" required>{{ producto.descripcion }}</textarea>
                
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" value="{{ producto.precio }}" step="0.01" min="0" required>
                
                <label for="categoria_id">Categoría</label>
                <select id="categoria_id" name="categoria_id" required>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}" {% if categoria.id == producto.categoria_id %}selected{% endif %}>{{ categoria.nombre }}</option>
                    {% endfor %}
                </select>
                
                <div class="imagen-actual">
                    <label>Imagen actual:</label><br>
                    {% if producto.imagen %}
                        <img src="{{ url_for('static', filename='images/' + producto.imagen) }}" alt="Imagen actual">
                    {% else %}
                        <span>No hay imagen</span>
                    {% endif %}
                </div>
                <label for="imagen">Nueva imagen</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
                <button type="submit">Actualizar</button>
            </form>
            <a class="volver" href="{{ url_for('admin_productos_productor') }}">← Volver a Mis Productos</a>
        </div>
    </div>
    <footer>
        <p>© 2025 AgronoMia - Todos los derechos reservados</p>
    </footer>

    <div id="logout-modal-bg" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(24,26,27,0.75);backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;">
        <div id="logout-modal" style="background:rgba(24,26,27,0.98);border-radius:18px;box-shadow:0 8px 32px rgba(0,230,176,0.13);padding:38px 32px 28px 32px;max-width:340px;width:90vw;text-align:center;position:relative;">
            <h2 style="color:#00e6b0;margin-bottom:18px;">¿Cerrar sesión?</h2>
            <p style="color:#eee;margin-bottom:24px;">¿Estás seguro de que deseas cerrar tu sesión?<br>Puedes continuar navegando si lo prefieres.</p>
            <div style="display:flex;gap:16px;justify-content:center;">
                <form id="logout-form" action="{{ url_for('logout') }}" method="get" style="display:inline;">
                    <button type="submit" class="modal-btn confirm" style="background:linear-gradient(90deg,#00e6b0 0%,#00b88a 100%);color:#181a1b;font-weight:600;border:none;border-radius:8px;padding:12px 18px;font-size:1em;box-shadow:0 2px 10px rgba(0,230,176,0.10);transition:background 0.2s,color 0.2s,transform 0.15s;cursor:pointer;">Sí, cerrar sesión</button>
                </form>
                <button class="modal-btn cancel" onclick="cerrarLogoutModal()" style="background:#222;color:#eee;font-weight:600;border:none;border-radius:8px;padding:12px 18px;font-size:1em;box-shadow:0 2px 10px rgba(0,230,176,0.10);transition:background 0.2s,color 0.2s,transform 0.15s;cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>
    <script>
    function abrirLogoutModal() {
        document.getElementById('logout-modal-bg').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function cerrarLogoutModal() {
        document.getElementById('logout-modal-bg').style.display = 'none';
        document.body.style.overflow = '';
    }
    document.addEventListener('DOMContentLoaded', function() {
        const logoutLink = document.getElementById('logout-link');
        if (logoutLink) {
            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();
                abrirLogoutModal();
            });
        }
        // Cerrar modal con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") cerrarLogoutModal();
        });
    });
    </script>
</body>
</html>
