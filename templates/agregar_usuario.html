<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Usuario | AgronoMia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #f5f5f7;
            background: url('{{ url_for("static", filename="images/background.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }
        nav {
            background: rgba(24, 26, 27, 0.65);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 32px;
        }
        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        nav a {
            color: #f5f5f7;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        nav a img {
            height: 28px;
            width: 28px;
            vertical-align: middle;
        }
        nav a:hover {
            background: rgba(255,255,255,0.08);
            color: #00e6b0;
        }
        .container {
            flex: 1 0 auto;
            max-width: 550px;
            margin: 80px auto 40px auto;
            background: rgba(24, 26, 27, 0.65);
            backdrop-filter: blur(10px);
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.25);
            text-align: center;
            border: 1.5px solid rgba(0,230,176,0.13);
        }
        h2 {
            color: #00e6b0;
            margin-bottom: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.45);
            font-size: 2em;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        form input, form select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1.5px solid #00e6b0;
            background: rgba(24, 26, 27, 0.82);
            color: #f5f5f7;
            font-size: 1.1em;
            transition: border 0.2s;
        }
        form input::placeholder {
            color: #aaa;
        }
        form input:focus, form select:focus {
            border-color: #00b88a;
            outline: none;
        }
        form button {
            background: #00e6b0;
            color: #181a1b;
            font-weight: bold;
            border: none;
            padding: 13px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            margin-top: 8px;
        }
        form button:hover {
            background: #00b88a;
            color: #fff;
            transform: scale(1.03);
        }
        .volver {
            display: inline-block;
            margin-top: 24px;
            color: #00e6b0;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .volver:hover {
            text-decoration: underline;
        }
        footer {
            background: rgba(24, 26, 27, 0.65);
            backdrop-filter: blur(10px);
            color: #aaa;
            text-align: center;
            padding: 18px 0 10px 0;
            font-size: 1em;
            letter-spacing: 1px;
            margin-top: auto;
            border-top: 1px solid #222;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="{{ url_for('gestion_usuarios') }}">
                <img src="{{ url_for('static', filename='images/pr.png') }}" alt="Gestión Usuarios">Gestión Usuarios
            </a>
            <a href="{{ url_for('admin_productos') }}">
                <img src="{{ url_for('static', filename='images/misp.png') }}" alt="Supervisión de Productos">Supervisión de Productos
            </a>
        </div>
        <div class="nav-right">
            <a href="{{ url_for('panel_admin') }}">
                <img src="{{ url_for('static', filename='images/panel.png') }}" alt="Panel Admin">Panel Admin
            </a>
            <a href="{{ url_for('logout') }}">
                <img src="{{ url_for('static', filename='images/cerrar.png') }}" alt="Cerrar Sesión">Cerrar Sesión
            </a>
        </div>
    </nav>
    <div class="container">
        <h2>Crear Nuevo Usuario</h2>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <select name="tipo_usuario" required>
                <option value="Cliente">Cliente</option>
                <option value="Productor">Productor</option>
            </select>
            <button type="submit">Agregar Usuario</button>
        </form>
        <a class="volver" href="{{ url_for('gestion_usuarios') }}">← Volver a Gestión</a>
    </div>
    <footer>
        <p>© 2025 AgronoMia - Todos los derechos reservados</p>
    </footer>
</body>
</html>
