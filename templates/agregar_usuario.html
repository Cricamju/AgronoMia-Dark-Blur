
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Usuario | AgronoMia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('{{ url_for("static", filename="images/verduras.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
    background-color: #2E7D32;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
}
.nav-left, .nav-right {
    display: flex;
    align-items: center;
    gap: 25px; 
}
nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 12px 18px;
    border-radius: 8px;
    transition: all 0.3s ease-in-out;
    font-size: 1em;
    display: flex;
    align-items: center;
    gap: 8px;
}
nav a img {
    height: 32px;
    width: 32px;
    vertical-align: middle;
}
nav a:hover {
    background: rgba(255, 255, 255, 0.3);
    color: #FFD700;
}
        .container {
            max-width: 420px;
            width: 100%;
            margin: 120px auto 40px auto;
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(46,125,50,0.18);
            padding: 36px 32px 28px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #2E7D32;
            margin-bottom: 28px;
            text-align: center;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form input, form select {
            width: 90%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1.5px solid #2E7D32;
            border-radius: 8px;
            font-size: 1em;
            background: #f9f9f9;
            transition: border 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        form input:focus, form select:focus {
            border-color: #FFD700;
            outline: none;
        }
        form button {
            background: #FFD700;
            color: #2E7D32;
            font-weight: bold;
            border: none;
            padding: 13px 0;
            width: 90%;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-top: 8px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        form button:hover {
            background: #FFC107;
            color: #1B5E20;
        }
        .volver {
            display: block;
            margin: 18px auto 0 auto;
            color: #2E7D32;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: color 0.2s;
        }
        .volver:hover {
            color: #FFD700;
            text-decoration: underline;
        }
        footer {
            background-color: #2E7D32;
            color: white;
            text-align: center;
            padding: 18px 0;
            width: 100%;
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 999;
            font-size: 1em;
        }
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                height: auto;
                padding: 10px 5px;
            }
            .nav-left, .nav-right {
                flex-direction: column;
                gap: 10px;
            }
            .container {
                max-width: 98vw;
                padding: 12px 4vw 18px 4vw;
                margin-top: 120px;
                margin-bottom: 80px;
            }
            form input, form select, form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="{{ url_for('gestion_usuarios') }}">
            <img src="{{ url_for('static', filename='images/pr.png') }}" alt="Gestion Usuarios">Gestión Usuarios
        </a>
            <a href="{{ url_for('admin_productos') }}">
            <img src="{{ url_for('static', filename='images/mip.png') }}" alt="Supervision de Productos">Supervision de Productos
        </a>
        <div class="nav-right">
            <a href="{{ url_for('panel_cliente') }}">
            <img src="{{ url_for('static', filename='images/perfil.png') }}" alt="Mi Cuenta">Mi Cuenta
        </a>
            <a href="{{ url_for('logout') }}">
            <img src="{{ url_for('static', filename='images/cerrar.png') }}" alt="Cerrar Sesión">Cerrar Sesión
        </a>
        </div>
    </nav>
    <div class="container">
        <h2>Agregar Usuario</h2>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <select name="tipo_usuario" required>
                <option value="Cliente">Cliente</option>
                <option value="Productor">Productor</option>
            </select>
            <button type="submit">Agregar</button>
        </form>
        <a class="volver" href="{{ url_for('panel_admin') }}">← Volver</a>
    </div>
    <footer>
        <p>© 2025 AgronoMia - Todos los derechos reservados</p>
    </footer>
</body>
</html>
